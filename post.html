<!DOCTYPE html>
<html lang="en">
<!-- =====================================================================
     The shell every memo is rendered into. One file, all memos.
     It reads the slug from the URL, finds that memo in posts.js, and
     renders posts/<slug>.md. Nothing here needs editing to publish.
     ===================================================================== -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship of Theses</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="canonical" href="https://shipoftheses.vercel.app/" />
  <meta property="og:site_name" content="Ship of Theses" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="Ship of Theses" />
  <meta property="og:url" content="https://shipoftheses.vercel.app/" />
</head>
<body>
  <div class="page">

    <header class="mast">
      <a class="mast__name" href="/">Ship of Theses</a>
      <nav class="nav">
        <span class="search" data-search data-search-target="/">
          <button class="search__toggle" type="button" data-search-toggle
                  aria-expanded="false" aria-label="Search memos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path>
            </svg>
          </button>
          <input class="search__field" type="search" data-search-field
                 placeholder="Search memos" aria-label="Search memos" autocomplete="off" />
        </span>
        <a class="nav__cta" href="https://tally.so" target="_blank" rel="noopener" aria-label="Submit a company"><span class="nav__full">Submit a company</span><span class="nav__short" aria-hidden="true">Submit</span></a>
      </nav>
    </header>

    <article class="post">
      <h1 class="post__title" data-title></h1>

      <div class="meta">
        <span data-date></span>
        <span class="meta__sep" aria-hidden="true">|</span>
        <span data-no></span>
        <span class="meta__sep" aria-hidden="true">|</span>
        <button class="meta__share" type="button" data-share>Share memo</button>
      </div>

      <div class="player" data-player>
        <audio preload="metadata"></audio>
        <button class="player__btn player__play" type="button" data-play aria-label="Play">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        </button>
        <button class="player__btn player__skip" type="button" data-back aria-label="Back 15 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5.4a6.8 6.8 0 1 1-6.8 6.8"/><path d="M12 2.4 8.7 5.4 12 8.4"/>
            <text x="12" y="15.1" font-size="9" font-weight="500" fill="currentColor" stroke="none" text-anchor="middle">15</text>
          </svg>
        </button>
        <button class="player__btn player__skip" type="button" data-fwd aria-label="Forward 15 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5.4a6.8 6.8 0 1 0 6.8 6.8"/><path d="M12 2.4 15.3 5.4 12 8.4"/>
            <text x="12" y="15.1" font-size="9" font-weight="500" fill="currentColor" stroke="none" text-anchor="middle">15</text>
          </svg>
        </button>
        <span class="player__time" data-elapsed>0:00</span>
        <div class="player__bar" data-bar role="slider" tabindex="0" aria-label="Seek"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="player__track"><span class="player__fill" data-fill></span></span>
        </div>
        <span class="player__time" data-duration>--:--</span>
        <span class="player__note" data-player-note hidden>Recording coming soon</span>
        <button class="player__rate" type="button" data-rate aria-label="Playback speed">1x</button>
      </div>

      <div class="prose" data-body></div>
      <noscript>
        <p class="prose">This memo is written in Markdown and rendered in the browser.
          <a href="" data-raw>Read the source</a>.</p>
      </noscript>

      <a class="back" href="/">&larr; All memos</a>
    </article>

    <nav class="rail" data-rail aria-label="Sections in this memo"></nav>

    <footer class="foot">&copy; Tiwa Adejuyigbe, 2026</footer>
  </div>

  <script src="/posts.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/post.js"></script>
  <script src="/site.js"></script>
</body>
</html>
