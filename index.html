<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship of Theses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#FFFFFF; --ink:#000000;
      --measure:720px; --ease:cubic-bezier(0.22,1,0.36,1);
    }
    *{box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      font-size:17px; line-height:1.62; -webkit-font-smoothing:antialiased;
    }
    .page{max-width:var(--measure); margin:0 auto; padding:0 28px 120px;}

    /* brand / masthead */
    .site{padding:64px 0 36px;}
    .site__name{font-size:19px; font-weight:700; letter-spacing:-0.01em;
      text-decoration:none; color:var(--ink);}

    /* index list — tight rows */
    .feed{margin:0; padding:0; list-style:none;}
    .feed__link{display:flex; align-items:baseline; justify-content:space-between; gap:24px;
      padding:7px 0; text-decoration:none; color:var(--ink);}
    .feed__title{font-size:17px; font-weight:500;
      background-image:linear-gradient(var(--ink),var(--ink));
      background-size:0% 1px; background-position:0 100%; background-repeat:no-repeat;
      transition:background-size 0.35s var(--ease);}
    .feed__link:hover .feed__title, .feed__link:focus-visible .feed__title{background-size:100% 1px;}
    .feed__date{flex:0 0 auto; font-size:14px; white-space:nowrap;}

    /* post */
    .post__title{font-size:30px; line-height:1.2; font-weight:700; letter-spacing:-0.01em; margin:0;}
    .post__date{margin:10px 0 0; font-size:14px;}
    .post__body{margin-top:36px;}
    .post__body p{margin:0 0 22px;}

    /* back */
    .back{display:inline-block; margin-top:48px; font-size:14px; text-decoration:none; color:var(--ink);
      background-image:linear-gradient(var(--ink),var(--ink));
      background-size:0% 1px; background-position:0 100%; background-repeat:no-repeat;
      transition:background-size 0.35s var(--ease);}
    .back:hover, .back:focus-visible{background-size:100% 1px;}

    a:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}

    @media (prefers-reduced-motion:reduce){ *{transition-duration:0.001ms !important;} }
    @media (max-width:640px){
      body{font-size:16px;}
      .page{padding:0 20px 80px;}
      .site{padding:40px 0 28px;}
      .post__title{font-size:25px;}
      .feed__link{gap:14px;}
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site">
      <a class="site__name" href="index.html">Ship of Theses</a>
    </header>

    <!-- Company case studies, sorted newest to oldest. Add new entries at the top. -->
    <ul class="feed">
      <li>
        <a class="feed__link" href="posts/jack-and-jill.html">
          <span class="feed__title">Jack &amp; Jill</span>
          <span class="feed__date">1 July 2026</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
