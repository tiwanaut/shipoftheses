<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship of Theses</title>
  <meta name="description" content="Memos on companies I find interesting." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="canonical" href="https://www.shipoftheses.com/" />
  <meta property="og:site_name" content="Ship of Theses" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ship of Theses" />
  <meta property="og:description" content="Memos on companies I find interesting." />
  <meta property="og:url" content="https://www.shipoftheses.com/" />

  <script src="/posts.js"></script>
</head>
<body>
  <div class="page">

    <header class="mast">
      <a class="mast__name" href="/">Ship of Theses</a>
      <nav class="nav">
        <span class="search" data-search>
          <button class="search__toggle" type="button" data-search-toggle
                  aria-expanded="false" aria-label="Search memos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path>
            </svg>
          </button>
          <input class="search__field" type="search" data-search-field
                 placeholder="Search" aria-label="Search" autocomplete="off" />
        </span>
        <a class="nav__cta" href="https://tally.so" target="_blank" rel="noopener" aria-label="Submit a company"><span class="nav__full">Submit a company</span><span class="nav__short" aria-hidden="true">Submit</span></a>
      </nav>
    </header>

    <main id="index"></main>
    <p class="feed__empty" data-empty hidden>No results.</p>

    <noscript>
      <ul class="feed">
        <li class="feed__row"><a class="feed__link" href="/posts/aircall"><span class="feed__title">Aircall</span></a></li>
        <li class="feed__row"><a class="feed__link" href="/posts/oura"><span class="feed__title">Oura</span></a></li>
        <li class="feed__row"><a class="feed__link" href="/posts/monzo"><span class="feed__title">Monzo</span></a></li>
        <li class="feed__row"><a class="feed__link" href="/posts/sweetgreen"><span class="feed__title">Sweetgreen</span></a></li>
        <li class="feed__row"><a class="feed__link" href="/posts/jack-and-jill"><span class="feed__title">Jack &amp; Jill</span></a></li>
      </ul>
    </noscript>

    <footer class="foot">&copy; Tiwa Adejuyigbe, 2026</footer>
  </div>

  <!-- builds the index from the POSTS list in posts.js -->
  <script>
  (function () {
    "use strict";
    var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var label = function (key) {
      var bits = key.split("-");
      return MONTHS[Number(bits[1]) - 1] + " " + bits[0];
    };

    // newest first; a tie inside a month falls back to the memo number
    var posts = POSTS.slice().sort(function (a, b) {
      return a.date === b.date ? b.no - a.no : (a.date < b.date ? 1 : -1);
    });

    var index = document.getElementById("index");
    var seenYear = {}, html = "";

    posts.forEach(function (post) {
      var year = post.date.split("-")[0];

      if (!seenYear[year]) {
        seenYear[year] = true;
        if (html) html += "</ul></section>";
        html +=
          '<section class="group" data-group>' +
            '<h2 class="year">' + year + "</h2>" +
          '<ul class="feed" data-list>';
      }

      html +=
        '<li class="feed__row" data-row data-title="' + post.title + '">' +
          '<a class="feed__link" href="/posts/' + post.slug + '">' +
            '<span class="feed__no">#' + ("00" + post.no).slice(-3) + "</span>" +
            '<span class="feed__title">' + post.title + "</span>" +
            '<span class="feed__dots" aria-hidden="true"></span>' +
            '<span class="feed__date">' + label(post.date) + "</span>" +
          "</a>" +
        "</li>";
    });
    if (html) html += "</ul></section>";
    index.innerHTML = html;

  })();
  </script>

  <script src="/site.js"></script>
</body>
</html>
