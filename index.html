<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship of Theses</title>
  <meta name="description" content="Memos on companies I find interesting." />
  <link rel="stylesheet" href="styles.css" />

  <!-- =====================================================================
       THE POST LIST — this is the only thing you edit to publish a memo.

       Add ONE object per memo. Order does not matter, the page sorts itself.

         no     the permanent memo number. Never reuse it, never renumber
                the older ones. The next memo is simply the next number.
         title  what shows on the index and in search
         slug   the file in posts/ without the ".html"
         date   "YYYY-MM" — drives the date column and the month scrubber

       That's it. Then copy posts/template.html to posts/<slug>.html.
       ===================================================================== -->
  <script>
    const POSTS = [
      { no: 4, title: "Oura",          slug: "oura",           date: "2026-08" },
      { no: 3, title: "Monzo",         slug: "monzo",          date: "2026-07" },
      { no: 2, title: "Sweetgreen",    slug: "sweetgreen",     date: "2026-06" },
      { no: 1, title: "Jack &amp; Jill",   slug: "jack-and-jill",  date: "2026-06" }
    ];
  </script>
</head>
<body>
  <div class="page">

    <header class="mast">
      <a class="mast__name" href="index.html">Ship of Theses</a>
      <nav class="nav">
        <span class="search" data-search>
          <button class="search__toggle" type="button" data-search-toggle
                  aria-expanded="false" aria-label="Search memos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path>
            </svg>
          </button>
          <input class="search__field" type="search" data-search-field
                 placeholder="Search memos" aria-label="Search memos" autocomplete="off" />
        </span>
        <a class="nav__link" href="faqs.html">FAQs</a>
        <a class="nav__cta" href="submit.html" aria-label="Submit a company"><span class="nav__full">Submit a company</span><span class="nav__short" aria-hidden="true">Submit</span></a>
      </nav>
    </header>

    <section class="hero">
      <h1 class="hero__title">Memos on companies I find interesting</h1>
    </section>

    <main id="index"></main>
    <p class="feed__empty" data-empty hidden>No memos match that search.</p>

    <noscript>
      <ul class="feed">
        <li class="feed__row"><a class="feed__link" href="posts/oura.html"><span class="feed__title">Oura</span></a></li>
        <li class="feed__row"><a class="feed__link" href="posts/monzo.html"><span class="feed__title">Monzo</span></a></li>
        <li class="feed__row"><a class="feed__link" href="posts/sweetgreen.html"><span class="feed__title">Sweetgreen</span></a></li>
        <li class="feed__row"><a class="feed__link" href="posts/jack-and-jill.html"><span class="feed__title">Jack &amp; Jill</span></a></li>
      </ul>
    </noscript>

    <ul class="scrub" data-scrub aria-label="Jump to month"></ul>

    <!-- Subscribe (Loops) -->
    <section class="sub">
      <h2 class="sub__title">Get each memo by email</h2>
      <p class="sub__note">One memo at a time. No other mail.</p>
      <div class="newsletter-form-container">
        <form class="newsletter-form" action="https://app.loops.so/api/newsletter-form/cmlhpzxre0m0q0ixs7v6iqon8" method="POST">
          <input class="newsletter-form-input" type="email" name="newsletter-form-input" placeholder="you@email.com" aria-label="Email address" required />
          <button type="submit" class="newsletter-form-button">Subscribe</button>
          <button type="button" class="newsletter-loading-button" style="display:none;">Please wait...</button>
        </form>
        <div class="newsletter-success" style="display:none;">
          <p class="newsletter-success-message">Thanks, you're on the list.</p>
        </div>
        <div class="newsletter-error" style="display:none;">
          <p class="newsletter-error-message">Something went wrong, please try again.</p>
        </div>
        <button class="newsletter-back-button" type="button" style="display:none;">&larr; Back</button>
      </div>
    </section>

    <footer class="foot">&copy; Tiwa Adejuyigbe, 2026</footer>
  </div>

  <!-- builds the index and the scrubber from POSTS above -->
  <script>
  (function () {
    "use strict";
    var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var label = function (key) {
      var bits = key.split("-");
      return MONTHS[Number(bits[1]) - 1] + " " + bits[0];
    };

    // newest first; a tie inside a month falls back to the memo number
    var posts = POSTS.slice().sort(function (a, b) {
      return a.date === b.date ? b.no - a.no : (a.date < b.date ? 1 : -1);
    });

    var index = document.getElementById("index");
    var seenYear = {}, seenMonth = {}, monthCount = {}, order = [], html = "";

    posts.forEach(function (post) {
      var year = post.date.split("-")[0];
      monthCount[post.date] = (monthCount[post.date] || 0) + 1;
      if (!seenMonth[post.date]) { seenMonth[post.date] = true; order.push(post.date); }

      if (!seenYear[year]) {
        seenYear[year] = true;
        if (html) html += "</ul></section>";
        var count = posts.filter(function (p) { return p.date.indexOf(year + "-") === 0; }).length;
        html +=
          '<section class="group" data-group>' +
            '<div class="year">' +
              '<h2 class="year__label">' + year + "</h2>" +
              '<span class="year__count">' + count + " memo" + (count === 1 ? "" : "s") + "</span>" +
            "</div>" +
          '<ul class="feed" data-list>';
      }

      // the first row of a month carries the anchor the scrubber jumps to
      var anchor = "";
      if (seenMonth[post.date] === true) {
        seenMonth[post.date] = "anchored";
        anchor = ' data-month="' + post.date + '"';
      }

      html +=
        '<li class="feed__row" data-row data-title="' + post.title.replace(/&amp;/g, "&") + '"' + anchor + ">" +
          '<a class="feed__link" href="posts/' + post.slug + '.html">' +
            '<span class="feed__no">#' + ("00" + post.no).slice(-3) + "</span>" +
            '<span class="feed__title">' + post.title + "</span>" +
            '<span class="feed__dots" aria-hidden="true"></span>' +
            '<span class="feed__date">' + label(post.date) + "</span>" +
          "</a>" +
        "</li>";
    });
    if (html) html += "</ul></section>";
    index.innerHTML = html;

    // the rail: one month per row, tick length scaled by how many memos it holds
    var scrub = document.querySelector("[data-scrub]");
    scrub.innerHTML = order.map(function (key) {
      var width = Math.min(52, 12 + monthCount[key] * 10);
      return "<li>" +
        '<button class="scrub__btn" type="button" data-scrub-key="' + key + '">' +
          '<span class="scrub__label">' + label(key) + "</span>" +
          '<span class="scrub__tickwrap"><span class="scrub__tick" style="width:' + width + 'px"></span></span>' +
        "</button></li>";
    }).join("");
  })();
  </script>

  <!-- Loops subscribe form handler (unchanged from Loops' own embed) -->
  <script>
  function submitHandler(event) {
    event.preventDefault();
    var container = event.target.parentNode;
    var form = container.querySelector(".newsletter-form");
    var formInput = container.querySelector(".newsletter-form-input");
    var success = container.querySelector(".newsletter-success");
    var errorContainer = container.querySelector(".newsletter-error");
    var errorMessage = container.querySelector(".newsletter-error-message");
    var backButton = container.querySelector(".newsletter-back-button");
    var submitButton = container.querySelector(".newsletter-form-button");
    var loadingButton = container.querySelector(".newsletter-loading-button");

    const rateLimit = () => {
      errorContainer.style.display = "flex";
      errorMessage.innerText = "Too many signups, please try again in a little while";
      submitButton.style.display = "none";
      formInput.style.display = "none";
      backButton.style.display = "block";
    }

    var time = new Date();
    var timestamp = time.valueOf();
    var previousTimestamp = localStorage.getItem("loops-form-timestamp");

    if (previousTimestamp && Number(previousTimestamp) + 60000 > timestamp) {
      rateLimit();
      return;
    }
    localStorage.setItem("loops-form-timestamp", timestamp);

    submitButton.style.display = "none";
    loadingButton.style.display = "flex";

    var formBody = "userGroup=&mailingLists=&email="
      + encodeURIComponent(formInput.value);

    fetch(event.target.action, {
      method: "POST",
      body: formBody,
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
      },
    })
      .then((res) => [res.ok, res.json(), res])
      .then(([ok, dataPromise, res]) => {
        if (ok) {
          success.style.display = "flex";
          form.reset();
        } else {
          dataPromise.then(data => {
            errorContainer.style.display = "flex";
            errorMessage.innerText = data.message ? data.message : res.statusText;
          });
        }
      })
      .catch(error => {
        if (error.message === "Failed to fetch") {
          rateLimit();
          return;
        }
        errorContainer.style.display = "flex";
        if (error.message) errorMessage.innerText = error.message;
        localStorage.setItem("loops-form-timestamp", '');
      })
      .finally(() => {
        formInput.style.display = "none";
        loadingButton.style.display = "none";
        backButton.style.display = "block";
      });
  }
  function resetFormHandler(event) {
    var container = event.target.parentNode;
    var formInput = container.querySelector(".newsletter-form-input");
    var success = container.querySelector(".newsletter-success");
    var errorContainer = container.querySelector(".newsletter-error");
    var errorMessage = container.querySelector(".newsletter-error-message");
    var backButton = container.querySelector(".newsletter-back-button");
    var submitButton = container.querySelector(".newsletter-form-button");

    success.style.display = "none";
    errorContainer.style.display = "none";
    errorMessage.innerText = "Something went wrong, please try again.";
    backButton.style.display = "none";
    formInput.style.display = "flex";
    submitButton.style.display = "flex";
  }

  var formContainers = document.getElementsByClassName("newsletter-form-container");
  for (var i = 0; i < formContainers.length; i++) {
    var formContainer = formContainers[i];
    if (formContainer.classList.contains('newsletter-handlers-added')) continue;
    formContainer.querySelector(".newsletter-form").addEventListener("submit", submitHandler);
    formContainer.querySelector(".newsletter-back-button").addEventListener("click", resetFormHandler);
    formContainer.classList.add("newsletter-handlers-added");
  }
  </script>

  <script src="site.js"></script>
</body>
</html>
