<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship of Theses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#FFFFFF; --ink:#000000;
      --measure:720px; --ease:cubic-bezier(0.22,1,0.36,1);
    }
    *{box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      font-size:17px; line-height:1.62; -webkit-font-smoothing:antialiased;
    }
    body.modal-open{overflow:hidden;}
    .page{max-width:var(--measure); margin:0 auto; padding:0 28px 120px;}

    .site{padding:64px 0 36px;}
    .site__name{font-size:19px; font-weight:700; letter-spacing:-0.01em;
      text-decoration:none; color:var(--ink);}

    .feed{margin:0; padding:0; list-style:none;}
    .feed__link{display:flex; align-items:baseline; justify-content:space-between; gap:24px;
      padding:7px 0; text-decoration:none; color:var(--ink);}
    .feed__title{font-size:17px; font-weight:500;
      background-image:linear-gradient(var(--ink),var(--ink));
      background-size:0% 1px; background-position:0 100%; background-repeat:no-repeat;
      transition:background-size 0.35s var(--ease);}
    .feed__link:hover .feed__title, .feed__link:focus-visible .feed__title{background-size:100% 1px;}
    .feed__date{flex:0 0 auto; font-size:14px; white-space:nowrap;}

    .post__title{font-size:30px; line-height:1.2; font-weight:700; letter-spacing:-0.01em; margin:0;}
    .post__date{margin:10px 0 0; font-size:14px;}

    /* Key takeaways heading + Full memo button */
    .takeaways{display:flex; align-items:center; justify-content:space-between; gap:16px;
      margin-top:38px;}
    .takeaways h2{font-size:18px; font-weight:700; letter-spacing:-0.01em; margin:0;}
    .memo-btn{font:inherit; font-size:13px; border:1px solid var(--ink); background:transparent;
      color:var(--ink); padding:6px 13px; border-radius:6px; cursor:pointer; white-space:nowrap;
      transition:background 0.25s var(--ease), color 0.25s var(--ease);}
    .memo-btn:hover, .memo-btn:focus-visible{background:var(--ink); color:var(--bg); outline:none;}

    .bullets{margin:16px 0 0; padding-left:20px;}
    .bullets li{margin:0 0 9px; line-height:1.55; font-size:16px;}

    .back{display:inline-block; margin-top:44px; font-size:14px; text-decoration:none; color:var(--ink);
      background-image:linear-gradient(var(--ink),var(--ink));
      background-size:0% 1px; background-position:0 100%; background-repeat:no-repeat;
      transition:background-size 0.35s var(--ease);}
    .back:hover, .back:focus-visible{background-size:100% 1px;}

    /* Full-screen memo overlay (PDF opens here, on top of the page) */
    .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6);
      display:none; align-items:center; justify-content:center; padding:24px; z-index:50;}
    .overlay.open{display:flex;}
    .modal{background:var(--bg); width:min(920px,100%); height:min(86vh,100%);
      border:1px solid var(--ink); display:flex; flex-direction:column;}
    .modal__bar{display:flex; align-items:center; gap:14px; padding:10px 14px;
      border-bottom:1px solid var(--ink); font-size:13px;}
    .modal__name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .modal__open{margin-left:auto; font-size:13px; color:var(--ink);}
    .modal__close{border:0; background:transparent; font:inherit; font-size:20px; line-height:1;
      cursor:pointer; color:var(--ink); padding:0 4px;}
    .modal__frame{flex:1; width:100%; border:0;}

    a:focus-visible, .modal__close:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}

    @media (prefers-reduced-motion:reduce){ *{transition-duration:0.001ms !important;} }
    @media (max-width:640px){
      body{font-size:16px;}
      .page{padding:0 20px 80px;}
      .site{padding:40px 0 28px;}
      .post__title{font-size:25px;}
      .feed__link{gap:14px;}
      .modal{height:100%; width:100%;}
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site">
      <a class="site__name" href="index.html">Ship of Theses</a>
    </header>

    <!-- Company case studies, sorted newest to oldest. Add new entries at the top. -->
    <ul class="feed">
      <li>
        <a class="feed__link" href="posts/jack-and-jill.html">
          <span class="feed__title">Jack &amp; Jill</span>
          <span class="feed__date">1 July 2026</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
