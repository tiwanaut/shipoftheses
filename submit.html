<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a company &mdash; Ship of Theses</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="canonical" href="https://shipoftheses.vercel.app/submit" />
  <meta property="og:site_name" content="Ship of Theses" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Submit a company" />
  <meta property="og:url" content="https://shipoftheses.vercel.app/submit" />

  <!-- =====================================================================
       <<< EDIT >>>  Paste your form URL between the quotes below and this
       page becomes a live form. Leave it empty and visitors see the short
       holding note instead.

       Tally is the easy route: make a form at tally.so, then copy the share
       link (it looks like https://tally.so/r/wAbCdE) in here. Any embeddable
       form URL works the same way.
       ===================================================================== -->
  <script>
    const SUBMIT_FORM_URL = "";
  </script>
</head>
<body>
  <div class="page">
    <header class="mast">
      <a class="mast__name" href="/">Ship of Theses</a>
      <nav class="nav">
        <span class="search" data-search data-search-target="/">
          <button class="search__toggle" type="button" data-search-toggle
                  aria-expanded="false" aria-label="Search memos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path>
            </svg>
          </button>
          <input class="search__field" type="search" data-search-field
                 placeholder="Search memos" aria-label="Search memos" autocomplete="off" />
        </span>
        <a class="nav__link" href="/faqs">FAQs</a>
        <a class="nav__cta" href="/submit" aria-label="Submit a company"><span class="nav__full">Submit a company</span><span class="nav__short" aria-hidden="true">Submit</span></a>
      </nav>
    </header>

    <article class="post">
      <h1 class="post__title">Submit a company</h1>

      <p class="label">The ask</p>
      <div class="prose">
        <p>If there is a company you think belongs here, tell me about it. One
          or two lines on why is plenty &mdash; what it does, and what makes the
          question about it interesting.</p>
      </div>

      <div id="submit-form"></div>

      <a class="back" href="/">&larr; All memos</a>
    </article>

    <footer class="foot">&copy; Tiwa Adejuyigbe, 2026</footer>
  </div>
  <script>
  (function () {
    var slot = document.getElementById("submit-form");
    if (SUBMIT_FORM_URL) {
      var frame = document.createElement("iframe");
      frame.className = "embed";
      frame.src = SUBMIT_FORM_URL;
      frame.title = "Submit a company";
      frame.loading = "lazy";
      slot.appendChild(frame);
    } else {
      slot.innerHTML = '<p class="form__note">The submission form is being set up. ' +
        'Until it is live, replying to any memo email reaches me directly.</p>';
    }
  })();
  </script>
  <script src="/site.js"></script>
</body>
</html>
